<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Actor context flowing from agent through MCP tools into Laravel">
  <rect width="1280" height="720" fill="#f0efe6"/>
  <text x="640" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#0a0a0a">One actor per request</text>
  <!-- Agent -->
  <rect x="60" y="160" width="280" height="400" fill="#ffffff" stroke="#0a0a0a" stroke-width="6"/>
  <rect x="60" y="160" width="280" height="70" fill="#7c3aed" stroke="#0a0a0a" stroke-width="6"/>
  <text x="200" y="205" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="24" font-weight="700" fill="#fafaf5">AI AGENT</text>
  <text x="90" y="280" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#0a0a0a">get_invoice</text>
  <text x="90" y="320" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#0a0a0a">refund_order</text>
  <text x="90" y="380" font-family="Georgia,serif" font-size="18" fill="#4a4a4a">Cannot pick tenant.</text>
  <text x="90" y="420" font-family="Georgia,serif" font-size="18" fill="#4a4a4a">Only calls tools.</text>
  <!-- Arrow 1 -->
  <path d="M360 360 L430 360" stroke="#0a0a0a" stroke-width="8"/>
  <polygon points="430,340 470,360 430,380" fill="#0a0a0a"/>
  <!-- MCP -->
  <rect x="490" y="160" width="300" height="400" fill="#ffd93d" stroke="#0a0a0a" stroke-width="6"/>
  <text x="640" y="220" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="24" font-weight="700" fill="#0a0a0a">MCP EDGE</text>
  <rect x="520" y="250" width="240" height="90" fill="#ffffff" stroke="#0a0a0a" stroke-width="4"/>
  <text x="640" y="285" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#0a0a0a">McpActor</text>
  <text x="640" y="315" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#2a2a2a">tenant · user · scopes</text>
  <rect x="520" y="370" width="240" height="50" fill="#7ae582" stroke="#0a0a0a" stroke-width="4"/>
  <text x="640" y="402" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#0a0a0a">bind once</text>
  <rect x="520" y="440" width="240" height="50" fill="#ff5a5f" stroke="#0a0a0a" stroke-width="4"/>
  <text x="640" y="472" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#0a0a0a">drop tenant_id</text>
  <!-- Arrow 2 -->
  <path d="M810 360 L880 360" stroke="#0a0a0a" stroke-width="8"/>
  <polygon points="880,340 920,360 880,380" fill="#0a0a0a"/>
  <!-- Laravel -->
  <rect x="940" y="160" width="280" height="400" fill="#ffffff" stroke="#0a0a0a" stroke-width="6"/>
  <rect x="940" y="160" width="280" height="70" fill="#ff2d87" stroke="#0a0a0a" stroke-width="6"/>
  <text x="1080" y="205" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="22" font-weight="700" fill="#0a0a0a">LARAVEL</text>
  <text x="970" y="290" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#0a0a0a">InvoiceFinder</text>
  <text x="970" y="330" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#0a0a0a">Policies</text>
  <text x="970" y="370" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#0a0a0a">Global scopes</text>
  <text x="970" y="440" font-family="Georgia,serif" font-size="18" fill="#4a4a4a">Same gate as</text>
  <text x="970" y="470" font-family="Georgia,serif" font-size="18" fill="#4a4a4a">the admin UI.</text>
</svg>