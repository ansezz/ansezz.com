<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="MCP auth gate in front of a Laravel SaaS">
  <rect width="1280" height="720" fill="#fafaf5"/>
  <rect x="40" y="40" width="1200" height="640" fill="#ffd93d" stroke="#0a0a0a" stroke-width="8"/>
  <rect x="80" y="80" width="520" height="560" fill="#ffffff" stroke="#0a0a0a" stroke-width="6"/>
  <text x="110" y="140" font-family="ui-monospace,Menlo,monospace" font-size="28" font-weight="700" fill="#0a0a0a">MCP SESSION</text>
  <rect x="110" y="170" width="460" height="70" fill="#3dd9c9" stroke="#0a0a0a" stroke-width="4"/>
  <text x="130" y="215" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#0a0a0a">tenant: acme · scopes: billing:read</text>
  <rect x="110" y="270" width="460" height="70" fill="#7ae582" stroke="#0a0a0a" stroke-width="4"/>
  <text x="130" y="315" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#0a0a0a">actor bound · tools unlocked</text>
  <rect x="110" y="370" width="460" height="70" fill="#ff5a5f" stroke="#0a0a0a" stroke-width="4"/>
  <text x="130" y="415" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#0a0a0a">model tenant_id → DROPPED</text>
  <text x="110" y="520" font-family="Georgia,serif" font-size="36" font-weight="700" fill="#0a0a0a">Auth is the product.</text>
  <text x="110" y="570" font-family="Georgia,serif" font-size="24" fill="#2a2a2a">Not a middleware afterthought.</text>
  <g transform="translate(720,140)">
    <rect x="0" y="80" width="420" height="360" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="6"/>
    <rect x="20" y="100" width="380" height="320" fill="#ff2d87" stroke="#0a0a0a" stroke-width="6"/>
    <circle cx="210" cy="220" r="70" fill="none" stroke="#0a0a0a" stroke-width="14"/>
    <rect x="175" y="220" width="70" height="120" rx="8" fill="#0a0a0a"/>
    <text x="210" y="420" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="26" font-weight="700" fill="#0a0a0a">LARAVEL GATE</text>
  </g>
</svg>